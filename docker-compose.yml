version: '3.8'

services:
  #Auth DB
  auth-db:
    image: postgres:15
    container_name: auth-db
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - saas-network
  # 🧠 Control Plane DB (Tenant metadata)
  control-db:
    image: postgres:15
    container_name: control-db
    restart: always
    environment:
      POSTGRES_DB: control_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - control-db-data:/var/lib/postgresql/data
    networks:
      - saas-network

  # 🧩 Shard DB 1
  shard-db-1:
    image: postgres:15
    container_name: shard-db-1
    restart: always
    environment:
      POSTGRES_DB: shard_db_1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - shard1-data:/var/lib/postgresql/data
    networks:
      - saas-network

  # 🧩 Shard DB 2
  shard-db-2:
    image: postgres:15
    container_name: shard-db-2
    restart: always
    environment:
      POSTGRES_DB: shard_db_2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - shard2-data:/var/lib/postgresql/data
    networks:
      - saas-network
  # ⚡ Redis (Tenant routing cache)
  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - saas-network
  # Kafka
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

# 🔗 Shared Network
networks:
  saas-network:
    driver: bridge

# 💾 Persistent Volumes
volumes:
  control-db-data:
  auth-db-data:
  shard1-data:
  shard2-data:
  redis-data: